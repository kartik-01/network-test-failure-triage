[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "network-test-failure-triage"
version = "0.1.0"
description = "Turn simulated networking test failures into prioritized triage cases with an audit log."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    "pytest>=8.0",
    "pyyaml>=6.0",
    "selenium>=4.25",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
tracker-demo = "tracker.__main__:main"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.setuptools.package-data]
tracker = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "selenium: drives the server-rendered UI in headless Chrome",
]
